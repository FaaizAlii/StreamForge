<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment - StreamForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-black text-white">

<nav class="border-b border-gray-800 bg-black/80">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <a href="{% url 'home' %}"
           class="text-2xl font-bold text-red-600">
            StreamForge
        </a>

        <a href="{% url 'plans' %}"
           class="text-gray-300 hover:text-white">
            Back to Plans
        </a>

    </div>
</nav>


<div class="mx-auto max-w-lg px-6 py-16">

    <div class="rounded-2xl border border-gray-800
                bg-gray-950 p-8">

        <h1 class="text-3xl font-bold">
            Complete Payment
        </h1>

        <div class="mt-6 rounded-lg bg-gray-900 p-5">

            <div class="flex justify-between">
                <span class="text-gray-400">
                    Plan
                </span>

                <span class="font-semibold">
                    {{ plan.name }}
                </span>
            </div>

            <div class="mt-3 flex justify-between">

                <span class="text-gray-400">
                    Amount
                </span>

                <span class="text-xl font-bold">
                    Rs. {{ plan.price }}
                </span>

            </div>

        </div>


        <form method="post" class="mt-8 space-y-5">

            {% csrf_token %}

            {% if plan.price > 0 %}

                <div>
                    <label class="mb-2 block text-sm text-gray-400">
                        Card Number
                    </label>

                    <input
                        type="text"
                        placeholder="4242 4242 4242 4242"
                        class="w-full rounded-lg border border-gray-700
                               bg-gray-900 px-4 py-3 outline-none
                               focus:border-red-600"
                    >
                </div>

                <div class="grid grid-cols-2 gap-4">

                    <div>
                        <label class="mb-2 block text-sm text-gray-400">
                            Expiry
                        </label>

                        <input
                            type="text"
                            placeholder="12/30"
                            class="w-full rounded-lg border border-gray-700
                                   bg-gray-900 px-4 py-3 outline-none
                                   focus:border-red-600"
                        >
                    </div>

                    <div>
                        <label class="mb-2 block text-sm text-gray-400">
                            CVV
                        </label>

                        <input
                            type="text"
                            placeholder="123"
                            class="w-full rounded-lg border border-gray-700
                                   bg-gray-900 px-4 py-3 outline-none
                                   focus:border-red-600"
                        >
                    </div>

                </div>

            {% else %}

                <div class="rounded-lg bg-gray-900 p-4 text-center text-gray-400">
                    This is a free plan. No payment is required.
                </div>

            {% endif %}


            <button
                type="submit"
                class="w-full rounded-lg bg-red-600 px-5 py-3
                       font-semibold hover:bg-red-700">

                {% if plan.price > 0 %}
                    Pay Rs. {{ plan.price }}
                {% else %}
                    Activate Free Plan
                {% endif %}

            </button>

        </form>

    </div>

</div>

</body>
</html>
