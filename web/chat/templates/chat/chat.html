<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StreamForge AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="min-h-screen bg-black text-white">


<!-- Navbar -->

<nav class="border-b border-gray-800 bg-black/80">

    <div class="mx-auto flex max-w-7xl items-center
                justify-between px-6 py-4">

        <a href="{% url 'home' %}"
           class="text-2xl font-bold text-red-600">
            StreamForge
        </a>

        <div class="flex items-center gap-6 text-sm">

            <a href="{% url 'home' %}"
               class="text-gray-400 hover:text-white">
                Home
            </a>

            <a href="{% url 'plans' %}"
               class="text-gray-400 hover:text-white">
                Plans
            </a>

            <a href="{% url 'profile' %}"
               class="text-gray-400 hover:text-white">
                Profile
            </a>

        </div>

    </div>

</nav>


<!-- Chat -->

<div class="mx-auto flex h-[calc(100vh-73px)]
            max-w-5xl flex-col px-4 py-6">


    <!-- Header -->

    <div class="mb-5">

        <h1 class="text-2xl font-bold">
            StreamForge AI
        </h1>

        <p class="mt-1 text-sm text-gray-500">
            Ask me about your subscription, movies, shows,
            or your StreamForge account.
        </p>

    </div>


    <!-- Messages -->

    <div id="messages"
         class="flex-1 space-y-4 overflow-y-auto
                rounded-2xl border border-gray-800
                bg-gray-950 p-6">


        <!-- Welcome -->

        <div class="flex">

            <div class="max-w-[80%] rounded-2xl
                        bg-gray-900 px-4 py-3">

                <p class="text-sm">
                    Hi {{ request.user.first_name|default:request.user.username }}!
                    👋
                </p>

                <p class="mt-1 text-sm text-gray-400">
                    How can I help you today?
                </p>

            </div>

        </div>

    </div>


    <!-- Input -->

    <form id="chat-form"
          class="mt-4 flex gap-3">

        {% csrf_token %}

        <input
            id="message-input"
            type="text"
            autocomplete="off"
            placeholder="Ask something..."
            class="flex-1 rounded-xl border border-gray-800
                   bg-gray-950 px-5 py-3 text-sm
                   outline-none transition
                   focus:border-red-600"
        >

        <button
            id="send-button"
            type="submit"
            class="rounded-xl bg-red-600 px-6 py-3
                   text-sm font-semibold
                   transition hover:bg-red-700">

            Send

        </button>

    </form>

</div>


<script>

const form = document.getElementById("chat-form");
const input = document.getElementById("message-input");
const messages = document.getElementById("messages");
const button = document.getElementById("send-button");


function addMessage(content, isUser) {

    const wrapper = document.createElement("div");

    wrapper.className = isUser
        ? "flex justify-end"
        : "flex";


    const message = document.createElement("div");

    message.className = isUser
        ? "max-w-[80%] rounded-2xl bg-red-600 px-4 py-3"
        : "max-w-[80%] rounded-2xl bg-gray-900 px-4 py-3";


    const text = document.createElement("p");

    text.className = "text-sm whitespace-pre-wrap";

    text.textContent = content;


    message.appendChild(text);
    wrapper.appendChild(message);

    messages.appendChild(wrapper);

    messages.scrollTop = messages.scrollHeight;
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = input.value.trim();

    if (!message) {
        return;
    }


    addMessage(message, true);

    input.value = "";

    button.disabled = true;
    button.textContent = "Thinking...";


    const csrfToken = document.querySelector(
        "[name=csrfmiddlewaretoken]"
    ).value;


    const formData = new FormData();

    formData.append("message", message);


    try {

        const response = await fetch(
            "{% url 'chat_api' %}",
            {
                method: "POST",

                headers: {
                    "X-CSRFToken": csrfToken
                },

                body: formData
            }
        );


        const data = await response.json();


        if (!response.ok) {

            addMessage(
                data.error || "Something went wrong.",
                false
            );

            return;
        }


        addMessage(
            data.response,
            false
        );


    } catch (error) {

        addMessage(
            "Unable to connect to the AI assistant.",
            false
        );

    } finally {

        button.disabled = false;
        button.textContent = "Send";

        input.focus();

    }

});

</script>

</body>

</html>
