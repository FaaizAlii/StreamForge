<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StreamForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center px-6">

<div class="w-full max-w-md">

    <a href="/" class="block text-center text-3xl font-bold text-red-600 mb-10">
        StreamForge
    </a>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">

        <h1 class="text-2xl font-bold mb-2">
            Create your account
        </h1>

        <p class="text-gray-400 mb-8">
            Join StreamForge and start exploring.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-950 border border-red-800 text-red-300
                            rounded-lg px-4 py-3 mb-5 text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-5">

            {% csrf_token %}

            <div>
                <label class="block text-sm text-gray-400 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full bg-gray-800 border border-gray-700
                           rounded-lg px-4 py-3 outline-none
                           focus:border-red-600"
                >
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                    class="w-full bg-gray-800 border border-gray-700
                           rounded-lg px-4 py-3 outline-none
                           focus:border-red-600"
                >
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full bg-gray-800 border border-gray-700
                           rounded-lg px-4 py-3 outline-none
                           focus:border-red-600"
                >
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                    class="w-full bg-gray-800 border border-gray-700
                           rounded-lg px-4 py-3 outline-none
                           focus:border-red-600"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-red-600 hover:bg-red-700
                       py-3 rounded-lg font-semibold transition"
            >
                Create Account
            </button>

        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            Already have an account?

            <a href="{% url 'login' %}" class="text-red-500 hover:text-red-400">
                Sign in
            </a>
        </p>

    </div>

</div>

</body>
</html>
